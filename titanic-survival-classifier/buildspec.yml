version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install -r titanic-survival-classifier/requirements.txt
  build:
    commands:
      - pytest titanic-survival-classifier/tests/ -v
      - python titanic-survival-classifier/titanic_survival_classifier.py --output model_artifacts/titanic_model.joblib
  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  files:
    - model_artifacts/titanic_model.joblib
  discard-paths: yes
